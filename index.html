<style>
:root{
  /* the laundromat: basin water, suds, petal-pink brand, ink */
  --basin:#FAF6F9;
  --suds:#FFFFFF;
  --petal:#FDEDF5;
  --petal-deep:#F6C9E2;

  /* text — every value below clears 5:1 on basin, suds and petal */
  --ink:#17101A;      /* 17.4:1 */
  --ink-2:#453A4C;    /*  9.9:1 */
  --ink-3:#5A4E61;    /*  7.2:1 */
  --ink-4:#6B5F73;    /*  5.6:1 — floor, smallest meta only */

  --magenta:#E6007E;        /* graphics + fills only, never text */
  --magenta-btn:#BE0068;    /* white on this = 6.2:1 */
  --magenta-text:#A8005D;   /* on light = 7.0:1 */
  --violet:#7B2C8F;
  --green:#1F7A44;          /* white on this = 5.3:1 */

  --edge:rgba(23,16,26,.10);
  --edge-soft:rgba(23,16,26,.06);
  --lift:0 0 0 1px rgba(23,16,26,.055), 0 1px 2px -1px rgba(23,16,26,.06), 0 2px 6px rgba(23,16,26,.04);
  --lift-2:0 0 0 1px rgba(23,16,26,.06), 0 2px 4px -2px rgba(23,16,26,.07), 0 12px 28px -8px rgba(23,16,26,.12);
  --lift-3:0 0 0 1px rgba(23,16,26,.07), 0 8px 16px -8px rgba(23,16,26,.12), 0 24px 48px -16px rgba(23,16,26,.22);

  /* 8pt grid */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s7:56px; --s8:64px; --s9:72px;
  --r-sm:8px; --r-md:16px; --r-lg:24px; --r-xl:32px;
  --ease:cubic-bezier(.23,1,.32,1);
  --shell:1140px;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{
  margin:0;background:var(--basin);color:var(--ink);overflow-x:clip;
  font-family:Outfit,system-ui,sans-serif;font-size:16px;line-height:1.55;
}
img{display:block;max-width:100%}
figure{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--magenta-btn);outline-offset:3px;border-radius:4px}

/* one content width everywhere — nothing indents further */
.shell{max-width:var(--shell);margin:0 auto;padding:0 var(--s3)}
@media(max-width:520px){
  .shell{padding:0 var(--s2)}
  footer.foot{padding-left:var(--s2);padding-right:var(--s2)}
}

/* ---------- type ---------- */
.display{font-family:Anton,Outfit,sans-serif;font-weight:400;text-transform:uppercase;
  letter-spacing:-.005em;line-height:.93;text-wrap:balance}
h1.display{font-size:clamp(40px,6.4vw,74px)}
h2.display{font-size:clamp(28px,3.6vw,44px)}
.grad{background:linear-gradient(119deg,#E6007E 12%,#7B2C8F 88%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:18px;line-height:1.6;color:var(--ink-2);text-wrap:pretty;max-width:64ch}
.lede-strong{font-size:clamp(20px,2vw,24px);line-height:1.35;font-weight:700;color:var(--ink);margin:0 0 var(--s2);text-wrap:balance}
.kicker{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}

/* ---------- top bar ---------- */
header.bar{position:sticky;top:0;z-index:60;background:rgba(250,246,249,.85);
  backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--edge-soft)}
.bar .shell{display:flex;align-items:center;gap:var(--s2);height:72px}
.mark{display:flex;align-items:center}
.mark img{height:28px;width:auto;display:block}
footer.foot .mark img{height:24px}
.bar nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.bar nav a{padding:8px 12px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink-2);
  transition:background-color .16s var(--ease),color .16s var(--ease)}
.bar nav a:hover{background:var(--petal);color:var(--ink)}
.bar nav a[aria-current="page"]{color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap;
  padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;
  transition:transform .14s var(--ease),box-shadow .18s var(--ease),background-color .18s var(--ease)}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--magenta-btn);color:#fff;box-shadow:0 1px 2px rgba(120,0,66,.3),0 8px 18px -8px rgba(190,0,104,.55)}
.btn-primary:hover{background:#A8005D}
.btn-ghost{background:var(--suds);color:var(--ink);box-shadow:var(--lift)}
.btn-ghost:hover{box-shadow:var(--lift-2)}
.bar nav a.btn{color:#fff;font-weight:600;margin-left:var(--s1)}
.bar nav a.btn:hover{background:#A8005D}
@media(max-width:820px){.bar nav a:not(.btn){display:none}}

/* ---------- hero ---------- */
.hero{padding-block:var(--s7) var(--s2)}
.hero h1{margin:0 0 var(--s3)}
.hero .lede{margin:0}
.trustline{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-top:var(--s3);
  color:var(--ink-3);font-size:16px;font-weight:500}
.trustline span{display:inline-flex;align-items:center;gap:var(--s1)}
.trustline i{width:6px;height:6px;border-radius:2px;background:var(--magenta);flex:none}
.hero-photo{margin-top:var(--s3);border-radius:var(--r-xl);overflow:hidden;
  box-shadow:var(--lift-3);outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
.hero-photo img{width:100%;aspect-ratio:1140/720;object-fit:cover}

/* ---------- sections ---------- */
.section{padding-block:var(--s9)}
.section-head{margin-bottom:var(--s4);max-width:560px}
.section-head.wide{max-width:880px}
.section-head h2{margin:var(--s2) 0 var(--s2)}
.section-head p{margin:0;color:var(--ink-2);font-size:16px;text-wrap:pretty}

/* ---------- product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s2)}
.card{position:relative;grid-column:span 6;display:flex;flex-direction:column;
  background:var(--suds);border-radius:var(--r-xl);padding:var(--s3);overflow:hidden;
  box-shadow:var(--lift-2);transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:var(--lift-3)}
.card:active{transform:scale(.99)}
.card--lead{grid-column:span 7}
.card--pair{grid-column:span 5}
.card--wide{grid-column:span 7}

/* the lead tile: brand gradient, with a scrim so white type stays legible */
.card--lead{color:#fff;background:radial-gradient(135% 150% at 90% 4%,
  #F3DBF7 0%,#EBABDB 16%,#E27BBF 32%,#DA4AA3 48%,#D11A87 66%,#A8005D 100%)}
.card--lead::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(58,0,33,.46) 0%,rgba(58,0,33,.18) 44%,rgba(58,0,33,0) 66%)}
.card--lead > *{position:relative}
.card--lead .card-name{color:rgba(255,255,255,.92)}
.card--lead .card-desc{color:#fff;font-weight:600}
.card--lead .card-meta{color:rgba(255,255,255,.88)}
.card--lead .chip{background:rgba(255,255,255,.24);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42)}
.card--lead .card-ico{background:#fff;color:var(--magenta-text)}

.card-top{display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s2)}
.card-ico{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--petal);color:var(--magenta-text);flex:none}
.card-ico svg{width:18px;height:18px}
.card-name{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tag-new{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:var(--green);padding:4px 8px;border-radius:var(--r-sm)}
.card h3{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.005em;
  font-size:32px;line-height:1;margin:0 0 var(--s1)}
.card--lead h3{font-size:clamp(32px,3.4vw,42px)}

/* ---------- detail pages ---------- */
.back{display:inline-flex;align-items:center;gap:var(--s1);font-size:15px;font-weight:600;color:var(--ink-2);

.detail-head{padding-block:var(--s5) 0;display:grid;gap:var(--s3);justify-items:start}

.eyebrow{display:inline-flex;align-items:center;gap:var(--s1);font-size:13px;font-weight:600;

.stage{display:grid;grid-template-columns:1fr minmax(220px,auto) 1fr;gap:var(--s2);align-items:center;padding-block:var(--s4) 0}

@media(min-width:941px){.co-btn{white-space:nowrap}}

.rail.left .co:nth-child(3){margin-right:40px}
.rail.right .co:nth-child(1){margin-left:8px}
.rail.right .co:nth-child(2){margin-left:48px}
.rail.right .co:nth-child(3){margin-left:16px}
.rail.right .co:nth-child(4){margin-left:40px}
.co-btn{position:relative;display:inline-flex;align-items:center;gap:var(--s1);
  background:var(--suds);color:var(--ink);border-radius:999px;padding:8px 16px;
  font-size:15px;font-weight:600;letter-spacing:-.005em;box-shadow:var(--lift);text-align:left;
  min-height:40px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.co-btn svg{width:18px;height:18px;color:var(--magenta-text);flex:none}
.co-btn:hover{transform:translateY(-1px);box-shadow:var(--lift-2)}
.co-btn:active{transform:scale(.96)}
.co-btn[aria-expanded="true"]{box-shadow:var(--lift-2),0 0 0 2px var(--magenta-btn)}
.co-btn .ln{position:absolute;top:50%;height:1px;background:linear-gradient(90deg,var(--edge),var(--magenta));pointer-events:none}
.rail.left .co-btn .ln{left:100%;width:var(--l,32px)}
.rail.right .co-btn .ln{right:100%;width:var(--l,32px);background:linear-gradient(270deg,var(--edge),var(--magenta))}
.co-btn .ln::after{content:"";position:absolute;top:50%;width:8px;height:8px;border-radius:50%;

  transition:transform .2s var(--ease)}
.rail.left .co-btn .ln::after{right:-4px}
.rail.right .co-btn .ln::after{left:-4px}
.co-btn:hover .ln::after{transform:translateY(-50%) scale(1.3)}
.rail.left .co:nth-child(1) .co-btn{--l:24px}
.rail.left .co:nth-child(2) .co-btn{--l:56px}
.rail.left .co:nth-child(3) .co-btn{--l:32px}
.rail.left .co:nth-child(4) .co-btn{--l:64px}
.rail.right .co:nth-child(1) .co-btn{--l:56px}
.rail.right .co:nth-child(2) .co-btn{--l:24px}
.rail.right .co:nth-child(3) .co-btn{--l:48px}
.rail.right .co:nth-child(4) .co-btn{--l:24px}

.pop{position:absolute;top:calc(100% + var(--s1));z-index:30;width:min(320px,78vw);
  background:var(--suds);border-radius:var(--r-lg);padding:var(--s2);box-shadow:var(--lift-3);
  opacity:0;transform:scale(.96) translateY(-4px);pointer-events:none;
  transition:opacity .16s var(--ease),transform .18s var(--ease)}

.rail.right .pop{left:0;transform-origin:top left}

.pop h4{margin:0 0 var(--s1);font-size:16px;font-weight:700;letter-spacing:-.01em;padding-right:var(--s3)}
.pop p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.pop .out{display:flex;gap:var(--s1);margin-top:var(--s2);padding-top:var(--s2);
  border-top:1px solid var(--edge-soft);font-size:14px;font-weight:600;color:var(--magenta-text)}
.pop .out svg{width:16px;height:16px;flex:none;margin-top:2px}
.pop-close{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:999px;
  display:grid;place-items:center;color:var(--ink-3)}
.pop-close:hover{background:var(--basin);color:var(--ink)}
.pop-close svg{width:14px;height:14px}

.device{position:relative;display:grid;place-items:center;max-width:500px;isolation:isolate}
.device .glow{position:absolute;inset:-6% -8%;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(230,0,126,.16),rgba(230,0,126,0) 72%)}

  color:var(--ink-3);font-size:14px;font-weight:500}

@media(max-width:940px){

  .rail{display:grid;grid-template-columns:1fr;gap:var(--s1)}
  .rail.left,.rail.right{align-items:stretch}

  .co-btn{width:100%;justify-content:flex-start;border-radius:var(--r-md);padding:12px 16px}
  .co-btn .ln{display:none}
  .co-btn::after{content:"+";margin-left:auto;color:var(--ink-3);font-weight:600}

  .pop{position:static;width:100%;margin-top:var(--s1);display:none;transform:none;box-shadow:var(--lift-2)}
  .co.open .pop{display:block;animation:popIn .2s var(--ease)}

}

.also .kicker{margin-right:var(--s1)}

.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.quote{background:var(--suds);border-radius:var(--r-lg);padding:var(--s3);box-shadow:var(--lift);
  display:flex;flex-direction:column;gap:var(--s2);
  transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.quote:hover{transform:translateY(-2px);box-shadow:var(--lift-2)}
.quote .qm{font-family:Anton,sans-serif;font-size:32px;line-height:.5;color:#C4BCC9}
.quote p{margin:0;font-size:16px;line-height:1.6;color:var(--ink);text-wrap:pretty}
.quote footer{margin-top:auto;padding-top:var(--s2);border-top:1px solid var(--edge-soft)}
.quote .who{display:block;font-size:15px;font-weight:600;line-height:1.3}
.quote .where{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
@media(max-width:900px){.quotes{grid-template-columns:1fr}}

/* ---------- cta ---------- */
.cta{border-radius:var(--r-xl);padding:clamp(32px,5vw,56px);
  background:linear-gradient(140deg,#1B0F1F 0%,#3A0F2C 55%,#7A1152 100%);color:#fff;
  display:grid;gap:var(--s2);justify-items:start;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(230,0,126,.5),rgba(230,0,126,0) 70%)}
.cta h2{margin:0;position:relative;max-width:18ch}

.cta .row{display:flex;flex-wrap:wrap;gap:var(--s1);position:relative;margin-top:var(--s1)}
.cta .btn-primary{background:var(--magenta);color:#fff}
.cta .btn-primary:hover{background:#F0198D}

.cta .btn-ghost:hover{background:rgba(255,255,255,.2)}

footer.foot{padding:var(--s4) var(--s3) var(--s7);color:var(--ink-3);font-size:14px;
  display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);align-items:center;
  max-width:var(--shell);margin:0 auto}

footer.foot span{margin-left:auto}


/* ---------- device mockups: desktop screen + floating phone ---------- */
.device.screen{max-width:600px;width:100%}
.screen-frame{position:relative;width:100%;background:#17101A;border-radius:var(--r-md);padding:8px;
  box-shadow:0 0 0 1px rgba(23,16,26,.6),0 24px 48px -20px rgba(23,16,26,.55),0 48px 80px -40px rgba(23,16,26,.4)}
.screen-frame img{width:100%;height:auto;aspect-ratio:1280/720;object-fit:cover;border-radius:var(--r-sm);display:block}

.device.handset{max-width:300px}

  transform:rotate(-2.5deg);transform-origin:50% 60%;
  box-shadow:0 0 0 1px rgba(23,16,26,.5),0 32px 56px -24px rgba(23,16,26,.5),0 64px 96px -48px rgba(23,16,26,.45);

/* section stage wrapper */
.stage-block{padding-block:var(--s9) 0}

  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- ecosystem ---------- */
.eco{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2)}

  box-shadow:var(--lift);text-align:center;transition:transform .28s var(--ease),box-shadow .28s var(--ease)}

@media(max-width:900px){

@keyframes marq{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-50% - (var(--s2) / 2)),0,0)}}
.tile{position:relative;flex:none;width:320px;height:216px;border-radius:var(--r-md);overflow:hidden;

}

  const key = (location.hash.replace(/^#\/?/,"").split("/")[0]) || "";

  document.getElementById("view").innerHTML = page() + `<footer class="foot">

                       : "Bubblepay — One platform for the whole laundromat";
  document.querySelectorAll('.bar nav a').forEach(a=>{
    if(key && a.getAttribute('href') === `#/${key}`) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  window.scrollTo({top:0,behavior:"instant"});
  wireCallouts();
}
function closeAll(){
  document.querySelectorAll('.co.open').forEach(c=>{
    c.classList.remove('open'); c.querySelector('.co-btn').setAttribute('aria-expanded','false');
  });
}
function wireCallouts(){
  document.querySelectorAll('.co').forEach(co=>{
    const btn=co.querySelector('.co-btn');
    btn.addEventListener('click',e=>{e.stopPropagation();
      const open=co.classList.contains('open'); closeAll();
      if(!open){co.classList.add('open'); btn.setAttribute('aria-expanded','true');}});
    co.querySelector('.pop-close').addEventListener('click',e=>{e.stopPropagation();closeAll();btn.focus();});
    co.querySelector('.pop').addEventListener('click',e=>e.stopPropagation());
  });
}
document.addEventListener('click', closeAll);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });
window.addEventListener('hashchange', render);
render();
</script>
</body>
